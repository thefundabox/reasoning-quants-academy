<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock paper · Reasoning &amp; Quants Academy</title>
<meta name="description" content="A full mixed paper on a clock, scored the way the exam scores it — with a penalty for a wrong answer and a breakdown by chapter at the end.">
<link rel="stylesheet" href="../assets/css/core.css">
<link rel="stylesheet" href="../assets/css/lesson.css">
<link rel="stylesheet" href="../assets/css/widgets.css">
</head>
<body class="theme-brand">
<div id="app"></div>

<script type="module">
import { applyTheme } from '../assets/js/config.js';
applyTheme();
import { buildPaper, runMock, PAPER_SIZES, SECONDS_PER_QUESTION, mmss } from '../assets/js/mock.js';
import { betaalSays } from '../assets/js/betaal.js';
import * as store from '../assets/js/store.js';
import { topbar, wireLearnerChip } from '../assets/js/shell.js';

const q = new URLSearchParams(location.search);
const n = PAPER_SIZES.includes(+q.get('n')) ? +q.get('n') : 25;
const app = document.getElementById('app');

/* The paper is not dealt until the learner says go. A clock that starts while
   somebody is still reading the instructions is not measuring what it claims. */
function brief() {
  const best = store.bestMock();
  const sat = store.mocks().length;
  app.innerHTML = `
    ${topbar({ tab: 'mock' })}
    <div class="wrap mockbrief">
      <p class="eyebrow">Mock paper</p>
      <h1>${n} questions, ${mmss(Math.round(n * SECONDS_PER_QUESTION))} on the clock.</h1>
      ${betaalSays(`Everywhere else here I explain the moment you commit. Not today.<br><br>
        You will get <b>no verdict</b> until the paper is over, the clock will not stop, and a wrong
        answer costs you <b>a third of a mark</b> — so leaving one blank is sometimes the better
        move, and knowing which is the skill the paper is really testing.<br><br>
        ${sat ? `You have sat <b>${sat}</b> before; your best is <b>${best.score}</b> of ${best.max}.`
              : `This is your first. Expect it to feel worse than practice — that is the point of it.`}`,
        { mood: 'thinking', size: 84 })}

      <div class="card mockbrief__rules">
        <p class="eyebrow">The rules, and why they are these rules</p>
        <ul>
          <li><b>${Math.round(SECONDS_PER_QUESTION)} seconds a question.</b> RPSC gives 150 questions
            in 180 minutes; this paper keeps the same pace.</li>
          <li><b>−1/3 for a wrong answer, 0 for a blank.</b> A blind guess between four is worth
            nothing on average; a guess between two is worth a third of a mark. That arithmetic is
            what decides when to attempt.</li>
          <li><b>Jump around freely.</b> Flag anything you want to come back to. Choosing what to
            leave is most of exam technique, and no practice set teaches it.</li>
          <li><b>All fourteen chapters</b>, mixed, plus shared-stimulus sets — a table or an
            arrangement with several questions hanging off it.</li>
        </ul>
      </div>

      <div class="row" style="gap:var(--s3);flex-wrap:wrap;margin-top:var(--s5)">
        <button class="btn btn--lg" id="go">Start the clock</button>
        ${PAPER_SIZES.filter(s => s !== n).map(s =>
          `<a class="btn btn--ghost" href="./?n=${s}">${s}-question paper instead</a>`).join('')}
        <a class="btn btn--quiet" href="../">Not now</a>
      </div>
    </div>`;
  wireLearnerChip(app);
  document.getElementById('go').onclick = start;
}

function start() {
  app.innerHTML = `<div class="wrap" style="padding:var(--s8) 0;text-align:center">
    <p class="lede">Setting the paper…</p></div>`;
  /* Built on a fresh seed each time, so no two papers are the same — and the
     seed is what a resume replays, not the questions themselves. */
  const paper = buildPaper({ n });
  runMock(paper, '#app', { backHref: '../' });
}

brief();
</script>
</body>
</html>
