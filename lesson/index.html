<script type="module">
/* Every lesson now has an address of its own. This page only exists so links and
   bookmarks made before that — including the query-string form a saved
   progress record may still hold — land where they meant to. */
import * as R from '../assets/js/routes.js';
const q = new URLSearchParams(location.search);
const id = q.get('id');
location.replace(R.href((id && R.lessonPath(id)) || ''));
</script>
