<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Reasoning &amp; Quants Academy</title>
<meta name="robots" content="noindex">
<!-- Self-contained on purpose: this page is served for ANY missing address, at
     any depth, so a relative stylesheet link would miss as often as it hit. -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf7f2; color: #1d1815;
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
  h1 { font-size: 30px; margin: 0 0 8px; letter-spacing: -.02em; }
  p { color: #5f564c; max-width: 44ch; margin: 0 auto 24px; }
  a { display: inline-block; background: #8c3b2e; color: #fff; text-decoration: none; font-weight: 700;
    padding: 13px 26px; border-radius: 14px; }
  @media (prefers-color-scheme: dark) { body { background: #16120f; color: #f3ede5; } p { color: #c2b8ab; } }
</style>
</head>
<body>
<main>
  <h1>That page is not here</h1>
  <p>The address may be mistyped, or a lesson may have been renamed since the link was made.</p>
  <a id="home" href="/">Go to the academy</a>
</main>
<script>
/* On GitHub Pages a project site lives under /<repository>/, not at the root. */
if (location.hostname.endsWith('github.io')) {
  var seg = location.pathname.split('/')[1];
  if (seg) document.getElementById('home').href = '/' + seg + '/';
}
</script>
</body>
</html>
