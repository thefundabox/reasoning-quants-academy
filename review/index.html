<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review · Reasoning &amp; Quants Academy</title>
<meta name="description" content="A mixed practice set drawn from whatever the spaced-repetition queue says you are about to forget.">
<link rel="stylesheet" href="../assets/css/core.css">
<link rel="stylesheet" href="../assets/css/lesson.css">
<link rel="stylesheet" href="../assets/css/widgets.css">
</head>
<body class="theme-brand">
<div id="app"></div>
<script>
/* If one request drops, the page stays blank for ever — ES modules load as a
   graph, so a single failed file takes the whole render with it, and the
   learner is left looking at an empty cream page with nothing to act on.
   Deliberately inline and dependency-free: it has to work on exactly the
   occasion when other things did not load. */
(function () {
  var failed = false;
  addEventListener('error', function (e) {
    if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) failed = true;
  }, true);
  function stuck() {
    var app = document.getElementById('app');
    if (!app || app.innerHTML.trim()) return;
    app.innerHTML = '<div style="max-width:30rem;margin:18vh auto;padding:0 24px;text-align:center;'
      + 'font:16px/1.55 ui-sans-serif,system-ui,-apple-system,\'Segoe UI\',sans-serif;color:#1d1815">'
      + '<h1 style="font-size:24px;margin:0 0 10px">That did not load</h1>'
      + '<p style="color:#5f564c;margin:0 0 22px">Part of the page never arrived — usually a dropped '
      + 'connection. Reloading almost always fixes it.</p>'
      + '<button onclick="location.reload()" style="background:#8c3b2e;color:#fff;border:0;font:inherit;'
      + 'font-weight:700;padding:12px 26px;border-radius:14px;cursor:pointer">Reload the page</button></div>';
  }
  addEventListener('error', function () { setTimeout(stuck, 400); }, true);
  setTimeout(stuck, 12000);
})();
</script>

<script type="module">
import { applyTheme } from '../assets/js/config.js';
applyTheme();
import { runLesson } from '../assets/js/runner.js';
import { makeSession } from '../assets/js/review.js';

const size = Math.min(20, Math.max(4, +new URLSearchParams(location.search).get('n') || 8));
const app = document.getElementById('app');

app.innerHTML = `<div class="wrap" style="padding:var(--s8) 0;text-align:center">
  <p class="lede">Assembling your set…</p></div>`;

makeSession(size).then(({ session, questions, dueCount }) => {
  if (!session) {
    app.innerHTML = `
      <div class="wrap" style="padding:var(--s8) 0;text-align:center">
        <h1>Nothing to review yet</h1>
        <p class="lede" style="margin:var(--s4) auto var(--s6);max-width:46ch">
          Finish a lesson first. Every question you answer registers the idea behind it, and those
          ideas come back here on a widening schedule.</p>
        <a class="btn btn--lg" href="../">Back to the dashboard</a>
      </div>`;
    return;
  }
  document.title = `Review · ${questions.length} questions`;
  runLesson(session);
});
</script>
</body>
</html>
